name: Automated PDF Directory Verification & Harvest

on:
  schedule:
    # Run every Sunday at midnight UTC
    - cron: '0 0 * * 0'
  workflow_dispatch:
    # Allow manual triggering from GitHub Actions tab

permissions:
  contents: write

jobs:
  verify-and-harvest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run PDF Directory Harvester
        run: node scripts/harvester.mjs --generate

      - name: Verify Link Health
        run: node scripts/harvester.mjs --verify

      - name: Commit & Push Updated Directory (if changed)
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action [PDF Harvester]"
          if [[ -n $(git status -s src/data/subjectPdfDirectory.json) ]]; then
            git add src/data/subjectPdfDirectory.json
            git commit -m "chore(data): auto-update subject PDF directory catalog [skip ci]"
            git push
          else
            echo "No directory updates detected."
          fi
