<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/web.png" />
    <link rel="apple-touch-icon" href="/web.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Techno Wallah | Open-Source Exam & Study Material Aggregator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <script>
      (function() {
        try {
          var stored = localStorage.getItem('technoedu-theme');
          var theme = stored || 'system';
          var isDark = theme === 'dark' || (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-white dark:bg-[#08090B] text-dark-900 dark:text-[#F8FAFC] antialiased selection:bg-brand-red selection:text-white font-sans">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
